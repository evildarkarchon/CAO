name: Rust workspace contract

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-hosted-validation:
    # Pull-request validation must remain schedulable without the separately
    # provisioned authenticated release cache.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc
          rustup default 1.97.0
          rustc --version

      - name: Acquire locked Cargo dependencies
        shell: pwsh
        run: cargo fetch --locked

      - name: Verify the reviewed baseline and Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rustc = (Get-Command rustc -ErrorAction Stop).Source
          python tools/verify_baseline.py
          python tools/verify_baseline.py --verify-input "rust-toolchain=$rustc"

      - name: Enforce architecture and supply-chain contracts
        shell: pwsh
        env:
          # Acquisition is complete; validation must resolve only the locked cache.
          CARGO_NET_OFFLINE: "true"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/verify_workspace.py
          python -m unittest tests.test_ci_workflow tests.test_verify_baseline tests.test_verify_workspace -v

      - name: Exercise the UI-independent application seam
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: "true"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: cargo test --package cao-domain --package cao-application --package cao-platform-windows --package cao-verification --lib --frozen
