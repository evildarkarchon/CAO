name: Rust workspace contract

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-offline-build:
    # This runner is provisioned from the authenticated W0 input cache. Hosted
    # image labels are moving sources and cannot satisfy the frozen toolchain gate.
    runs-on: [self-hosted, Windows, X64, tracetide-offline]
    timeout-minutes: 180
    env:
      CARGO_NET_OFFLINE: "true"
      CAO_RUN_RELEASE_STAGING_TEST: "1"
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify the pinned runner toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'CAO_MSVC_TOOLCHAIN_DIR',
            'CAO_WINDOWS_SDK_DIR',
            'CAO_WINDOWS_SDK_ISO',
            'CAO_CARGO_HOME',
            'CAO_RUSTUP_HOME',
            'SKIA_SOURCE_DIR',
            'SKIA_NINJA_COMMAND',
            'SKIA_GN_COMMAND',
            'LLVM_HOME'
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or -not (Test-Path -LiteralPath $value)) {
              throw "Missing authenticated runner input: $name"
            }
          }
          $env:CARGO_HOME = $env:CAO_CARGO_HOME
          $env:RUSTUP_HOME = $env:CAO_RUSTUP_HOME
          $rustc = (Get-Command rustc -ErrorAction Stop).Source
          $cargo = (Get-Command cargo -ErrorAction Stop).Source
          $git = (Get-Command git -ErrorAction Stop).Source
          "CAO_CARGO_COMMAND=$cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAO_GIT_COMMAND=$git" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAO_RUSTC_COMMAND=$rustc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python tools/verify_baseline.py
          python tools/verify_baseline.py --verify-input "rust-toolchain=$rustc"
          python tools/verify_baseline.py --verify-input "msvc-toolchain=$env:CAO_MSVC_TOOLCHAIN_DIR"
          python tools/verify_baseline.py --verify-input "windows-sdk=$env:CAO_WINDOWS_SDK_ISO"

      - name: Enforce architecture and supply-chain contracts
        shell: pwsh
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/verify_workspace.py
          python -m unittest tests.test_verify_baseline tests.test_verify_workspace -v

      - name: Exercise the UI-independent application seam
        shell: pwsh
        run: cargo test --workspace --lib --frozen

      - name: Replay the governed setup tracer
        shell: pwsh
        run: >-
          cargo run --package cao-verification --bin cao-verification --frozen --
          --root . --manifest verification/tracers/setup/manifest.json

      - name: Build all twelve packages without acquisition
        shell: pwsh
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: python tools/build_workspace.py
