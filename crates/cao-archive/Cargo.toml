[package]
name = "cao-archive"
description = "The bethutil archive layer ported onto the ba2 crate for CAO."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# A leaf: no workspace members (#476). `cao-optimizers` adapts this crate to
# core's archive-reader trait.
[dependencies]
# `ba2` depends on `directxtex` itself; the root `[patch.crates-io]` makes it link
# the same fork as `cao-optimizers` (#479).
ba2.workspace = true
# Parallel read and compress of an Archive's files, as bethutil's
# `std::execution::par` did (#461). The only place the port uses `rayon`.
rayon.workspace = true
thiserror.workspace = true

[features]
# `Settings::for_test`, which sets an Archive Size Cap no game has, so tests
# can reach the cap with small files. Enable it only from
# `[dev-dependencies]`, so no caller can skip a game's cap in a release build.
test-support = []

[dev-dependencies]
# Enables `test-support` for this crate's own integration tests; Cargo
# unifies the feature onto the library those tests link.
cao-archive = { workspace = true, features = ["test-support"] }
# Builds the DDS fixtures for the DX10 round trips.
directxtex.workspace = true

[build-dependencies]
embed-resource.workspace = true
