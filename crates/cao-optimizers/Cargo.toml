[package]
name = "cao-optimizers"
description = "CAO's texture, mesh, animation and archive backends, plus the composition root."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# This crate overrides the workspace's `unsafe_code = "forbid"` with `deny`, so
# that the one module allowed `unsafe` can opt out by attribute: `device`, which
# initializes COM on the Run Worker (#494) and creates the D3D11 device for GPU
# BC7 (#495). `forbid` could not be lowered there (E0453). Cargo cannot combine
# `workspace = true` with a local key, so this table replaces `[workspace.lints]`
# entirely; keep every other lint in step with the root.
[lints.rust]
unsafe_code = "deny"

[dependencies]
# The archive reader core's extraction reads through (#497).
cao-archive.workspace = true
cao-core.workspace = true
cao-profiles.workspace = true
# The capacity and volume-identity probes of the Capacity Check (#497). The
# scenarios also predict Mod Roots in the MSVC-canonical form Preparing gives them.
cao-winfs.workspace = true
# The Application Log sink's timestamps (#470).
chrono.workspace = true
# Resolves to CAO's fork through the root `[patch.crates-io]` (#479).
directxtex.workspace = true
log.workspace = true
# The Mesh backend (#504), without the parity corpus's `corpus` feature.
nifly-sys.workspace = true
thiserror.workspace = true
# `device`'s COM initialization and its D3D11 device for GPU BC7 (#459, #495).
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_System_Com",
] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# Builds raw TES3, TES4 and FO4 Archives with names `cao-archive` never writes,
# as the C++ suite built them with `rsm-bsa` directly.
ba2.workspace = true

# The Animation scenarios' binary is also their fake `hkxcmd.exe`, which
# libtest would reject the converter's arguments for; it runs its own scenarios.
[[test]]
name = "animations"
harness = false
