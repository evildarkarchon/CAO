[package]
name = "cao-core"
description = "CAO's Optimization Run core: Asset Routing, asset execution, the Run lifecycle, Run Evidence, the Run Executor and the Optimization Run Service."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# No C++ toolchain is needed to build or test this crate (#476, user story 76).
# Mod Roots resolve through `cao-winfs`'s `canonical`, so the text
# matches what `CAO-STAGING` manifests record.
[dependencies]
cao-winfs.workspace = true
getrandom.workspace = true
log.workspace = true
thiserror.workspace = true

[features]
# The fakes of this crate's seams that cao-core's, cao-optimizers' and
# cao-gui's run scenarios share (#547). Enable it only from
# `[dev-dependencies]`, so no fake is compiled into a release build.
test-support = []

[dev-dependencies]
# Enables `test-support` for this crate's own integration tests; Cargo
# unifies the feature onto the library those tests link.
cao-core = { workspace = true, features = ["test-support"] }
