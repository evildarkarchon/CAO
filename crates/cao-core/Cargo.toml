[package]
name = "cao-core"
description = "CAO's Optimization Run core: Asset Routing, asset execution, the Run lifecycle, Run Evidence, the Run Executor and the Optimization Run Service."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# No C++ toolchain is needed to build or test this crate (#476, user story 76).
# Mod Roots resolve through `cao-winfs`'s MSVC-canonical helper, so the text
# matches what C++ wrote into `CAO-STAGING` manifests.
[dependencies]
cao-winfs = { path = "../cao-winfs" }
getrandom.workspace = true
log.workspace = true
thiserror.workspace = true
