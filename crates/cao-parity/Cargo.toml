[package]
name = "cao-parity"
description = "CAO's differential parity harness: runs the C++ oracle and the Rust driver on one corpus case and compares their facts and output trees. Never shipped."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# The Archive rule parses both sides' Archives, and recipes build input
# Archives, with the same port the Rust side extracts through (#497).
cao-archive.workspace = true
# `run` drives the same composition root as the GUI; it fills the options model
# from `case.json` and reads the run's typed events and evidence back.
cao-core.workspace = true
cao-optimizers.workspace = true
cao-profiles.workspace = true
# Hand-written cases build their Textures synthetically (#473).
directxtex.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# The Archive rule's tests build Archives that differ in one header or entry
# fact at a time, which `cao-archive`'s fixed options never would.
ba2.workspace = true
