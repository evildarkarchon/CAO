# The pinned local asset list (#473, #501): the real Skyrim Meshes and
# Animations a recipe's `local_asset` entry may use, by `id`.
#
# The bytes are never committed. They come from the gitignored pool, which
# holds the user's own BSAs at `<pool>/le/` and `<pool>/sse/`; the harness
# finds it at `--local-assets`, then `CAO_LOCAL_ASSETS`, then `tests/local`.
# Each entry pins the SHA-256 of its extracted bytes, so a pool from another
# game patch makes the cases using it not run instead of comparing different
# inputs. `docs/parity-oracle.md` says how to populate the pool and add
# entries; `cao-parity local-assets` checks the pool against this list.
#
# Fields: `id` (lowercase ASCII letters, digits, `.`, `_`, `-`), `edition`
# (`le` or `sse`), `archive` (the BSA's file name), `path` (the `/`-separated
# internal path), `category` (`static`, `skinned`, `headpart`, `facegen`,
# `lod` or `animation`), `sha256`, and an optional `note`.
#
# LE entries are still to be pinned: the research (#473) calls for about 20
# LE Animations, the conversion inputs, and about 30 LE Meshes. They need an
# LE install to hash.

