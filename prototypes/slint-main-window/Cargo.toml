[package]
name = "cao-slint-main-window-prototype"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

# Standalone: keeps this throwaway prototype out of any future CAO Cargo workspace.
[workspace]

[dependencies]
slint = { version = "~1.18", features = ["unstable-winit-030", "raw-window-handle-06"] }
rfd = "0.17"
raw-window-handle = "0.6"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
slint-build = "~1.18"
