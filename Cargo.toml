# Rust port of Cathedral Assets Optimizer (ADR 0003).
#
# This virtual workspace grows beside the C++ tree: its members live under
# `crates/`, CMake never looks there, and Cargo never looks at `src/` or `tests/`,
# so nothing has to move when the C++ tree is deleted.
#
# Minimum native toolchain (documented, not enforced): Visual Studio 2026 (v145)
# Build Tools and Windows SDK 10.0.26100. That is the same install the C++
# `vs2026-windows` preset needs, so one setup builds both trees. Rust cannot pin
# MSVC; `cc` and `embed-resource` find the installed Visual Studio or use a
# Developer Command Prompt's environment.
#
# The Rust toolchain itself is pinned exactly in `rust-toolchain.toml`; raise it,
# `rust-version` below and the README's build section together in one commit.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
publish = false

# `unsafe` is forbidden everywhere except `cao-winfs`, `nifly-sys` and the D3D11
# device module of `cao-optimizers`. Members opt in with `lints.workspace = true`.
# Cargo cannot mix `workspace = true` with local lint keys, and `forbid` cannot be
# lowered by an `#[allow]` in source (E0453), so an overriding crate declares its
# own `[lints]` table instead and must copy every other lint from here. The same
# rule means the D3D11 module cannot opt out by attribute while its crate
# inherits `forbid`.
[workspace.lints.rust]
unsafe_code = "forbid"

# Version pins decided by the port's research tickets (#459-#473). Members take
# them with `dep.workspace = true` and add their own features.
[workspace.dependencies]
# Workspace members other members depend on.
cao-archive = { path = "crates/cao-archive" }
cao-core = { path = "crates/cao-core" }
cao-optimizers = { path = "crates/cao-optimizers" }
cao-profiles = { path = "crates/cao-profiles" }
cao-winfs = { path = "crates/cao-winfs" }
nifly-sys = { path = "crates/nifly-sys" }
# Archives (#461). Exact pin: bsa-rs#14 proposes dropping its directxtex dependency.
ba2 = "=3.0.1"
# Textures (#459). `[patch.crates-io]` below replaces this with CAO's fork, so
# `ba2` and CAO share one DirectXTex build.
directxtex = "1.3.0"
# The D3D11 device for GPU BC7 (#459).
windows = "0.62"
# File safety (#463).
windows-sys = "0.61"
getrandom = "0.3"
dunce = "1"
# Compressed HDPT records in plugins (#505, deviation 17). The `zlib` backend is
# the one `ba2` already builds, so the graph keeps one zlib.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# GUI (#462, #466). `~1.18` because `unstable-winit-030` and the undocumented
# `SLINT_NO_MUDA` may change in any minor release.
slint = { version = "~1.18", features = ["unstable-winit-030", "raw-window-handle-06"] }
# `common-controls-v6` stays off; the manifest carries no ComCtl32 v6 entry (#471).
rfd = "0.17"
raw-window-handle = "0.6"
# Errors, logging and parallelism (#468, #470). `anyhow` is for the two binaries only.
thiserror = "2"
anyhow = "1"
log = "0.4"
# The Application Log's timestamps and `cao-gui`'s log-file stamp (#470). Only
# the local clock is needed; defaults are off here because a member cannot turn
# off the default features of a workspace dependency.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rayon = "1"
# `case.json` and the Rust driver's `RunFacts` JSON (#472).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `cao-parity`'s pinned local asset list, `local-assets.toml` (#501).
toml = "1"
# Build scripts (#460, #471).
cc = "1"
embed-resource = "3"

# CAO's fork of directxtex-rs (#479), on its 1.x line so it still satisfies
# `ba2`'s `directxtex = "1.1.0"`. A patch replaces the crate for the whole
# graph, so CAO and `ba2` link one copy of DirectXTex, the `may2026` release the
# C++ parity oracle also builds. The fork's FORK.md records its upstream base and
# delta. Pinned by `rev`: move it together with `cargo update -p directxtex`.
[patch.crates-io]
directxtex = { git = "https://github.com/evildarkarchon/directxtex-rs", rev = "0862d750e78a0eaf5bb0817570f0eb9ca6900c50" }

# DirectXTex's encoded bytes depend on how its C++ is optimized, not only on
# `/fp:fast` (which the fork sets): an unoptimized build orients some BC3 blocks
# differently from the oracle's Release build (#491). Dev builds therefore
# optimize the crate, which `cc` passes on to the C++ compiler.
[profile.dev.package.directxtex]
opt-level = 3
